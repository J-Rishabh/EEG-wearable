CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# Stack sizes — nRF54L15 needs larger stacks than Zephyr defaults for BLE
# (sourced from Nordic's own nRF54L15 peripheral sample board configs)
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EEG Wearable"
CONFIG_BT_MAX_CONN=1
# maximum ATT payload size (bytes) — keep <= BT_BUF_ACL_TX_SIZE - 4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# Data Packet Length Extension — NOT auto-enabled here; instead requested
# manually 3 s after connect (see dle_work in ble.c) to avoid 0x23
# LL_PROC_COLLISION with Windows' connection parameter update procedure.
# USER_DATA_LEN_UPDATE exposes bt_conn_le_data_len_update() for manual calls.
CONFIG_BT_USER_DATA_LEN_UPDATE=y
# PHY update — Windows fires its own LL procedures immediately on connect;
# if the nRF also fires an automatic PHY update at the same time the two
# LL procedures collide → 0x23 LL_PROC_COLLISION → disconnect.
# Disable automatic PHY update (same root cause as the DLE workaround above).
CONFIG_BT_AUTO_PHY_UPDATE=n
# number of queued "prepare write" operations
CONFIG_BT_ATT_PREPARE_COUNT=2
# GATT client is required for MTU auto-update (even though we are a peripheral)
CONFIG_BT_GATT_CLIENT=y
# automatically negotiate a larger MTU on connect instead of doing it manually
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
# NOTIFY_MULTIPLE disabled — when on, Zephyr uses ATT opcode 0x9F
# ("Handle Value Multiple Notification") instead of the standard 0x1B.
# Windows WinRT writes the CSF bit saying it supports 0x9F, so Zephyr uses
# it, but WinRT's CharacteristicValueChanged event does NOT fire for 0x9F —
# only for 0x1B. Result: firmware streams fine (RTT confirms), but every
# packet is silently dropped by WinRT before Python ever sees it.
# iOS handles 0x9F correctly, which is why iPhone works but Windows doesn't.
# CONFIG_BT_GATT_NOTIFY_MULTIPLE is not set
# cosmetic: BLE appearance = "Generic Heart Rate Sensor" (close enough for EEG)
CONFIG_BT_DEVICE_APPEARANCE=833
# Do not bond with clients — avoids Windows WinRT CCCD-write failure caused by
# stale bond state after firmware reflash (device forgets bond, Windows does not).
CONFIG_BT_BONDABLE=n

# ADC — VBAT sense on P1.13
CONFIG_ADC=y

# Ring buffer — used by the ADS1299 EEG driver to queue samples between
# the DRDY workqueue handler and the main loop BLE drain.
CONFIG_RING_BUFFER=y

# I2C shell — for bus scanning / diagnostics (disable once IMU is confirmed working)
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y

# IMU — LIS2DW12 via raw I2C (imu.c talks directly to i2c22, no sensor driver).
# The Zephyr LIS2DW12 / ST sensor driver is intentionally disabled:
#   - driver init assumptions (power-mode enum, deferred-init) caused silent
#     device_is_ready() failures on this custom board
#   - raw I2C gives explicit WHO_AM_I confirmation and direct register control
# DTS node has status = "disabled" to prevent driver probe at boot.
# CONFIG_SENSOR and CONFIG_LIS2DW12 are deliberately not set.
# I2C debug logging - shows every i2c_read/write and error detail
CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_RTT_BUFFER=1
# RTT Viewer
# channel 0 = log output
# channel 1 = shell