CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# Stack sizes — nRF54L15 needs larger stacks than Zephyr defaults for BLE
# (sourced from Nordic's own nRF54L15 peripheral sample board configs)
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EEG Wearable"
CONFIG_BT_MAX_CONN=1
# maximum ATT payload size (bytes) — keep <= BT_BUF_ACL_TX_SIZE - 4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# enable Data Packet Length Extension — host requests larger LL PDUs on connect
CONFIG_BT_DATA_LEN_UPDATE=y
# number of queued "prepare write" operations
CONFIG_BT_ATT_PREPARE_COUNT=2
# GATT client is required for MTU auto-update (even though we are a peripheral)
CONFIG_BT_GATT_CLIENT=y
# automatically negotiate a larger MTU on connect instead of doing it manually
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
# bundle multiple notifications into one packet when possible
CONFIG_BT_GATT_NOTIFY_MULTIPLE=y
# cosmetic: BLE appearance = "Generic Heart Rate Sensor" (close enough for EEG)
CONFIG_BT_DEVICE_APPEARANCE=833
